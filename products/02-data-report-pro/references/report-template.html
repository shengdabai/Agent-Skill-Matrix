<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数据分析报告 · data-report-pro</title>
<!-- 文本和表格可离线；图表依赖 CDN，离线时明确显示不可用。 -->
<script id="chart-library" defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#f7f6f3;
    --paper:#ffffff;
    --ink:#1a1a1a;
    --ink-soft:#5c5c5c;
    --ink-faint:#707070;
    --line:#e6e3dd;
    --accent:#1f3a5f;        /* 强调色：沉稳深蓝 */
    --accent-soft:#e8eef5;
    --good:#2f7d5b;          /* 正向 */
    --bad:#b23b3b;           /* 负向 */
    --warn:#b8860b;
    --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.04);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg);
    color:var(--ink);
    line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:960px;margin:0 auto;padding:64px 28px 96px;}

  /* ---- 标题区 ---- */
  .masthead{border-bottom:3px solid var(--ink);padding-bottom:28px;margin-bottom:44px;}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;}
  .headline{font-size:34px;line-height:1.25;font-weight:800;margin:14px 0 16px;letter-spacing:-.01em;}
  .summary{font-size:18px;color:var(--ink-soft);max-width:62ch;}
  .meta{margin-top:18px;font-size:13px;color:var(--ink-faint);display:flex;gap:22px;flex-wrap:wrap;}
  .meta b{color:var(--ink);font-weight:600;}

  /* ---- 区块标题 ---- */
  .section{margin:56px 0 0;}
  .section-eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;margin-bottom:8px;}
  .section-title{font-size:22px;font-weight:800;margin-bottom:24px;letter-spacing:-.01em;}

  /* ---- KPI 卡片行 ---- */
  .kpi-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;}
  .kpi{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:22px 20px;box-shadow:var(--shadow);}
  .kpi .label{font-size:13px;color:var(--ink-faint);font-weight:600;}
  .kpi .value{font-size:32px;font-weight:800;margin:6px 0 4px;font-variant-numeric:tabular-nums;letter-spacing:-.02em;}
  .kpi .delta{font-size:13px;font-weight:600;}
  .kpi .delta.up{color:var(--good);}
  .kpi .delta.down{color:var(--bad);}
  .kpi .delta.flat{color:var(--ink-faint);}

  /* ---- 发现卡片 ---- */
  .finding{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:30px 28px;box-shadow:var(--shadow);margin-bottom:26px;}
  .finding-rank{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.1em;}
  .finding-title{font-size:21px;font-weight:800;line-height:1.35;margin:6px 0 14px;letter-spacing:-.01em;}
  .finding-body{color:var(--ink-soft);font-size:15.5px;margin-bottom:8px;}
  .sowhat{margin-top:14px;padding:14px 16px;background:var(--accent-soft);border-left:3px solid var(--accent);border-radius:0 8px 8px 0;font-size:15px;}
  .sowhat b{color:var(--accent);}
  .chart-box{margin-top:22px;position:relative;height:300px;}

  /* ---- 关注列表 ---- */
  .watch{background:#fff8ec;border:1px solid #f0e3c6;border-radius:12px;padding:22px 24px;}
  .watch ul{list-style:none;}
  .watch li{padding:8px 0 8px 26px;position:relative;color:var(--ink-soft);font-size:15px;}
  .watch li::before{content:"⚑";position:absolute;left:0;color:var(--warn);}

  /* ---- 建议 ---- */
  .recs{counter-reset:rec;}
  .rec{display:flex;gap:16px;padding:16px 0;border-bottom:1px solid var(--line);}
  .rec:last-child{border-bottom:none;}
  .rec .num{flex:0 0 30px;height:30px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}
  .rec .txt{font-size:15.5px;color:var(--ink);}
  .rec .txt small{display:block;color:var(--ink-faint);font-size:13px;margin-top:3px;}

  /* ---- 数据表 ---- */
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--paper);}
  table{width:100%;border-collapse:collapse;font-size:14px;}
  th,td{padding:12px 16px;text-align:left;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums;}
  th{background:#fafafa;font-weight:700;color:var(--ink-soft);font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;position:sticky;top:0;}
  tbody tr:last-child td{border-bottom:none;}
  td.neg{color:var(--bad);font-weight:600;}
  td.pos{color:var(--good);font-weight:600;}

  footer{margin-top:64px;padding-top:24px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink-faint);text-align:center;}
  @media(max-width:600px){.headline{font-size:26px;}.kpi .value{font-size:26px;}}
</style>
</head>

      </table>
    </div>
  </section>

  <footer>由 data-report-pro 生成 · 报告数据内嵌；文本与表格可离线，图表需联网。分析过程的传输与留存取决于宿主平台</footer>
</div>

<script>
const DATA = JSON.parse(document.getElementById("report-data").textContent);

/* ===================== 渲染逻辑（一般无需改动） ===================== */
const $ = id => document.getElementById(id);
const PALETTE = ["#1f3a5f","#3a6ea5","#6fa3d2","#9cc3e6","#c8def0","#e8eef5"];
// Runtime chart tokens. Keep single-series appearance stable; series colors come from PALETTE.
const CHART_THEME = {
  lineFill:"rgba(31,58,95,.12)", ink:"#1a1a1a", grid:"#eee",
  borderWidth:2, lineTension:.3, pointRadius:3, scatterRadius:5,
  titleFont:{size:14,weight:"600"}, titlePadding:{bottom:14}
};

function renderMeta(){
  $("r-kicker").textContent = DATA.meta.kicker;
  $("r-headline").textContent = DATA.meta.headline;
  $("r-summary").textContent = "一句话摘要：" + DATA.meta.summary;
  $("m-source").textContent = DATA.meta.source;
  $("m-rows").textContent = DATA.meta.rows;
  $("m-period").textContent = DATA.meta.period;
  $("m-date").textContent = DATA.meta.date;
  document.title = DATA.meta.headline;
}
function el(tag, className, text){
  const node = document.createElement(tag);
  if(className) node.className = className;
  if(text !== undefined && text !== null) node.textContent = String(text);
  return node;
}
function renderKpis(){
  $("kpi-row").replaceChildren(...DATA.kpis.map(k=>{
    const card=el("div","kpi");
    const dir=["up","down","flat"].includes(k.dir)?k.dir:"";
    card.append(el("div","label",k.label),el("div","value",k.value),el("div","delta "+dir,k.delta));
    return card;
  }));
}
function renderWatch(){
  $("watch-list").replaceChildren(...DATA.watch.map(w=>el("li","",w)));
}
function renderRecs(){
  $("recs").replaceChildren(...DATA.recs.map((r,i)=>{
    const card=el("div","rec"),text=el("div","txt",r.t);
    text.append(el("small","",r.note||""));card.append(el("div","num",i+1),text);return card;
  }));
}
function renderTable(){
  $("tbl-head").replaceChildren(...DATA.table.head.map(h=>el("th","",h)));
  $("tbl-body").replaceChildren(...DATA.table.rows.map(row=>{
    const flag=row.length>DATA.table.head.length?row[row.length-1]:null;
    const cells=row.slice(0,DATA.table.head.length),tr=el("tr");
    tr.append(...cells.map((c,i)=>el("td",i===cells.length-2&&flag==="neg"?"neg":"",c)));
    return tr;
  }));
}
function chartDataTable(c){
  const details=el("details","table-wrap"),table=el("table"),head=el("thead"),body=el("tbody"),header=el("tr");
  const headings=c.type==="scatter" ? ["数据集",c.xTitle||"X",c.yTitle||"Y"] : ["类别",...c.datasets.map(d=>d.label)];
  headings.forEach(label=>{
    const cell=el("th","",label);cell.setAttribute("scope","col");header.append(cell);
  });
  head.append(header);
  const rows=c.type==="scatter"
    ? c.datasets.flatMap(d=>d.data.map(p=>[d.label,p.x,p.y]))
    : c.labels.map((label,i)=>[label,...c.datasets.map(d=>d.data[i])]);
  rows.forEach(values=>{
    const row=el("tr");row.append(...values.map(value=>el("td","",value)));body.append(row);
  });
  table.append(el("caption","",c.title),head,body);
  details.append(el("summary","","查看图表数据"),table);
  return details;
}
function chartCanvas(c,i){
  const canvas=el("canvas");canvas.id="chart-"+i;
  canvas.setAttribute("role","img");canvas.setAttribute("aria-label",c.title);
  return canvas;
}
function renderFindings(){
  $("findings").replaceChildren(...DATA.findings.map((f,i)=>{
    const card=el("div","finding"),so=el("div","sowhat"),box=el("div","chart-box");
    so.append(el("b","","So What："),document.createTextNode(String(f.sowhat??"")));
    box.append(chartCanvas(f.chart,i));
    card.append(el("div","finding-rank",f.rank),el("div","finding-title",f.title),el("div","finding-body",f.body),so,box,chartDataTable(f.chart));
    return card;
  }));
}
function drawCharts(){
  DATA.findings.forEach((f,i)=>{
    const c = f.chart;
    if(!c || !["bar","line","doughnut","scatter"].includes(c.type)) return;
    const multiple = c.datasets.length > 1;
    const ds = c.datasets.map((d,di)=>{
      const color = PALETTE[(multiple ? di : c.type==="scatter" ? 1 : 0)%PALETTE.length];
      const base = {
        label:d.label, data:d.data,
        backgroundColor: c.type==="line" ? (multiple ? color : CHART_THEME.lineFill)
          : c.type==="scatter" ? color
          : !multiple || c.type==="doughnut" ? c.labels.map((_,k)=>PALETTE[k%PALETTE.length]) : color,
        borderColor:multiple?color:PALETTE[0], borderWidth:CHART_THEME.borderWidth,
        tension: c.type==="line"?CHART_THEME.lineTension:0, fill:c.type==="line"&&!multiple,
        pointRadius: c.type==="scatter"?CHART_THEME.scatterRadius:CHART_THEME.pointRadius
      };
      return base;
    });
    const cfg = {
      type:c.type,
      data:{ labels:c.labels, datasets:ds },
      options:{
        responsive:true, maintainAspectRatio:false,
        plugins:{
          legend:{display:(c.type==="doughnut" || multiple)},
          title:{display:true,text:c.title,font:CHART_THEME.titleFont,color:CHART_THEME.ink,padding:CHART_THEME.titlePadding}
        },
        scales: (c.type==="doughnut") ? {} : {
          y:{ beginAtZero:true, grid:{color:CHART_THEME.grid},
              title: c.yTitle?{display:true,text:c.yTitle}:undefined },
          x:{ grid:{display:false},
              title: c.xTitle?{display:true,text:c.xTitle}:undefined }
        }
      }
    };
    const canvas = document.getElementById("chart-"+i);
    try {
      new Chart(canvas, cfg);
    } catch {
      // A plugin/runtime error must not blank subsequent charts or expose raw error details.
      try { Chart.getChart(canvas)?.destroy(); } catch {}
      document.querySelectorAll(".chart-box")[i].replaceChildren(el("p","","图表暂时无法显示；请先查看报告文本与明细数据"));
    }
  });
}

renderMeta(); renderKpis(); renderFindings(); renderWatch(); renderRecs(); renderTable();
if(window.Chart){ drawCharts(); }
else{
  document.querySelectorAll(".chart-box").forEach(b=>b.replaceChildren(el("p","","图表需联网加载 Chart.js；文本与表格可离线查看")));
  // A deferred CDN request must not prevent the report text and data tables from rendering.
  $("chart-library").addEventListener("load",()=>{
    if(window.Chart){
      document.querySelectorAll(".chart-box").forEach((box,i)=>box.replaceChildren(chartCanvas(DATA.findings[i].chart,i)));
      drawCharts();
    }
  },{once:true});
}
</script>
</body>
